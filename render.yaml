# Legacy Render demo definition only. Production is Alibaba Cloud and uses the
# SQLite + systemd architecture documented in PROJECT_MEMORY.md.
services:
  - type: web
    name: technexus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python technexus_app/app.py --host 0.0.0.0 --port $PORT --no-browser
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TECHNEXUS_AI_ENABLED
        value: "true"
      - key: TECHNEXUS_AI_BASE_URL
        value: "https://api.deepseek.com"
      - key: TECHNEXUS_AI_MODEL
        value: "deepseek-v4-pro"
      - key: TECHNEXUS_AI_TIMEOUT
        value: "50"
      - key: TECHNEXUS_ADMIN_USERNAME
        value: "admin"
      - key: DATABASE_URL
        sync: false
      - key: TECHNEXUS_AI_API_KEY
        sync: false
      - key: TECHNEXUS_ADMIN_PASSWORD
        sync: false
  - type: web
    name: technexus-web
    runtime: node
    plan: free
    rootDir: technexus_web
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: TECHNEXUS_API_BASE_URL
        value: https://technexus-demo.onrender.com
